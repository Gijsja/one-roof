
sandbox_mode = "danger-full-access"
model_verbosity = "low"
model_reasoning_summary = "none"
[sandbox_workspace_write]
network_access = true

[mcp_servers.unity]
command = "/home/geisha/.local/bin/unity"
args = ["mcp"]

[features.network_proxy]
enabled = true
allow_local_binding = false

[features.network_proxy.domains]
localhost = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"
